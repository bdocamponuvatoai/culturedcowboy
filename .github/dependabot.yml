version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # eslint-config-next's React plugin does not declare ESLint 10 support yet.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # @types/node tracks the oldest supported runtime (engines.node >= 20.9).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
